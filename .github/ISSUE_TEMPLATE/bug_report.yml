name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If this is a **security** problem, please do not
        file it here — use the private advisory form instead:
        https://github.com/amoldeole/Everstory-My-Untold-Legacy/security/advisories/new

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See the error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Everstory version or commit
      placeholder: "main @ 8f3480d, or the Docker tag"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options: [macOS, Windows, Linux, Docker]
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
      placeholder: v22.22.3
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - Embedded (default, no DATABASE_URL)
        - Postgres server
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run doctor`
      description: This tells us most of what we need. Paste the whole thing.
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output or browser console errors. Redact anything personal.
      render: shell
    validations:
      required: false

name: Feature request
description: Suggest an improvement, or a new writing prompt
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is this?
      options:
        - A new feature or improvement
        - A new writing prompt or chapter
        - A change to an existing prompt
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: prompt
    attributes:
      label: If this is a prompt, write it here
      description: |
        The exact wording you would like added. Good prompts cannot be answered
        in one word, and the follow-up asks for a sensory detail.
      placeholder: |
        Question: …
        Follow-up: …
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      # One PR for the Next.js/React family instead of four.
      nextjs:
        patterns:
          ["next", "react", "react-dom", "eslint-config-next", "@types/react", "@types/react-dom"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      linting:
        patterns: ["eslint*", "prettier", "typescript", "@typescript-eslint/*"]
      testing:
        patterns: ["vitest", "@vitest/*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
